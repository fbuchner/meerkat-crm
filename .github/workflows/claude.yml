name: Claude Code

# Dispatch work to Claude from GitHub by mentioning @claude in an issue, an issue
# comment, a PR comment or a PR review. Claude pushes a branch and opens a PR.
#
# Only users with write access to this repository can trigger this workflow; the
# action enforces that itself (see docs/security.md in anthropics/claude-code-action).
# Repository rules Claude must follow live in .github/CLAUDE_INSTRUCTIONS.md,
# because the local CLAUDE.md is gitignored and therefore invisible to CI.

on:
  issues:
    types: [opened, assigned]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    name: Respond to @claude
    if: |
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Vitest config passes --no-experimental-webstorage, which requires Node >= 22.4
          node-version: 22
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock

      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          prompt: |
            Read .github/CLAUDE_INSTRUCTIONS.md before you change anything and
            follow it. It defines this repository's definition of done, the
            two-allowlist contact-field trap, the i18n locale parity rule and
            the git boundaries that apply to you.
          claude_args: |
            --max-turns 40
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(cd:*),Bash(go vet:*),Bash(go test:*),Bash(go build:*),Bash(gofmt:*),Bash(yarn tsc:*),Bash(yarn test:*),Bash(yarn install:*),Bash(gh pr create:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh issue view:*),Bash(gh issue comment:*)"
